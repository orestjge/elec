name: Release Android

# バージョンタグ（例: v1.0.0）を push すると署名済み APK をビルドし
# GitHub Releases に添付する。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # Release 作成に必要

jobs:
  build-and-release:
    name: build signed APK & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.5
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 が未設定です（リポジトリの Settings > Secrets で登録してください）"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elec-release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/elec-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Build signed APKs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --split-per-abi \
            --build-name="$VERSION" --build-number="${{ github.run_number }}"
          flutter build apk --release \
            --build-name="$VERSION" --build-number="${{ github.run_number }}"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/elec-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/elec-${GITHUB_REF_NAME}-universal.apk"
          ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
